<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Fredoka",ui-rounded,system-ui,sans-serif;color:#6e2448;display:grid;place-items:center;padding:20px;
  background:#fff6f9;background-image:radial-gradient(circle at 15% 10%,#ffd9e8 0,transparent 40%),radial-gradient(circle at 85% 85%,#ffd3e6 0,transparent 40%),radial-gradient(#ffc2d8 1px,transparent 1.4px);background-size:auto,auto,22px 22px;overflow:hidden}
.wrap{width:min(360px,100%);text-align:center}
.env{position:relative;width:240px;height:160px;margin:0 auto 34px;filter:drop-shadow(0 16px 24px rgba(168,42,92,.3))}
.env .body{position:absolute;inset:0;background:linear-gradient(#ffc9dc,#ffb3cf);border-radius:14px}
.env .letter{position:absolute;left:18px;right:18px;top:18px;height:120px;background:#fffaf5;border-radius:8px;transition:transform .8s cubic-bezier(.3,1.3,.5,1) .35s;display:grid;place-items:center;font-family:"Pacifico",cursive;color:#d63b77;font-size:22px}
.env .front{position:absolute;inset:0;border-radius:14px;z-index:2;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  background:linear-gradient(160deg,#ffb3cf,#ff9fc0 60%,#ff8fb7)}
.env .front::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.3%,rgba(214,59,119,.18) 50%,transparent 50.7%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49.3%,rgba(214,59,119,.18) 50%,transparent 50.7%) right/50% 100% no-repeat}
.env .flap{position:absolute;left:0;right:0;top:0;height:95px;transform-origin:top;transition:transform .6s ease;z-index:3;
  clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(#ff85ae,#f76b9d);border-radius:14px 14px 0 0}
.seal{position:absolute;left:50%;top:78px;width:50px;height:50px;margin-left:-25px;border-radius:50%;z-index:4;display:grid;place-items:center;font-size:24px;
  background:radial-gradient(circle at 35% 30%,#ff6f9f,#c2306a);box-shadow:0 3px 0 #8f2150,0 6px 12px rgba(0,0,0,.2);transition:transform .4s,opacity .4s}
.env .letter{z-index:1}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .seal{transform:scale(0) rotate(90deg);opacity:0}
.open .letter{transform:translateY(-70px)}
h1{font-family:"Pacifico",cursive;font-weight:400;color:#d63b77;font-size:30px;margin:0 0 4px}
p{margin:0 0 18px;color:#9b5a7a}
form{display:grid;gap:12px}
input[type=password]{font:inherit;font-size:18px;padding:15px 18px;border-radius:999px;border:2px solid #ffcfe0;background:#fff;color:#6e2448;text-align:center;outline:none;box-shadow:0 6px 18px -10px rgba(168,42,92,.4)}
input[type=password]:focus{border-color:#ff85ae}
button{font:inherit;font-size:18px;font-weight:600;color:#fff;border:0;border-radius:999px;padding:14px;cursor:pointer;background:linear-gradient(#ff85ae,#f25390);box-shadow:0 6px 0 #a82a5c,0 12px 24px -8px rgba(214,59,119,.6)}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a82a5c}
button[disabled]{opacity:.7}
label{font-size:14px;color:#9b5a7a;display:flex;gap:8px;justify-content:center;align-items:center}
.err{color:#d63b77;min-height:22px;font-weight:600}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
</style>
</head>

const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function openWith(key) {
  const b = b64d(BLOB);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12));
  return new TextDecoder().decode(plain);
}
function show(html) {
  // attendre la fin du chargement : sinon document.write ajoute l'appli à la page d'entrée au lieu de la remplacer

  if (document.readyState === "complete") go(); else addEventListener("load", go, { once: true });
}
